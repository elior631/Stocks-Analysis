# דוגמה בלבד — מטריצת אישורים לפי workspace, בהתאם לברירת המחדל בסעיף 23 של המפרט.
# approval: always | first_20_then_optional | auto

- workspace: company_a
  actions:
    jira.create:
      approval: always
    jira.update:
      approval: always
    tasks.create:
      approval: first_20_then_optional
    gmail.send:
      approval: always   # לא רלוונטי לפני V1.2/V3, נשאר חסום כברירת מחדל
    calendar.invite:
      approval: always

- workspace: personal
  actions:
    tasks.create:
      approval: first_20_then_optional
    collections.add_item:
      approval: auto
